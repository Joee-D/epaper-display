; epaper-display — ESP32 + e-ink WiFi-provisioning + scheduled image puller
; Configured for: ESP32-WROOM-32E devkit + Waveshare 4.2" V2 (SSD1683, b/w).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    zinggjm/GxEPD2 @ ^1.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.15.0
    tzapu/WiFiManager @ ^2.0.17

build_flags =
    -D CORE_DEBUG_LEVEL=1

; --- Alternative: ESP32-C3 devkit ---
; [env:esp32c3]
; platform = espressif32
; board = esp32-c3-devkitm-1
; framework = arduino
; monitor_speed = 115200
; lib_deps = ${env:esp32dev.lib_deps}
